[package]
name = "wand"
version = "0.1.0"
description = "Draw gestures in the air with a Joy-Con 2 to trigger actions on your PC"
license = "MIT"
edition = "2021"
default-run = "wand"

[lib]
name = "wand_lib"
crate-type = ["rlib"]

[[bin]]
name = "wand"
path = "src/main.rs"

# Headless tool: generate synthetic IMU recordings and replay recordings
# through the same pipeline the app uses.
[[bin]]
name = "wandtool"
path = "src/bin/wandtool.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures = "0.3"
btleplug = "0.13"
uuid = "1"

glam = "0.30"
aes = "0.8"
fastrand = "2"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Devices_Bluetooth",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
